<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gift Circles</title>
  <meta name="description" content="Family wishlists: share what you want, claim a gift, and keep it a surprise.">
  <!-- What a texted or shared link shows (iMessage, WhatsApp, Slack, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gift Circles">
  <meta property="og:title" content="You're invited to a Gift Circle 🎄">
  <meta property="og:description" content="Share wishlists with family, claim gifts without spoiling the surprise, and keep everyone's sizes in one place.">
  <meta property="og:url" content="https://judemarkwell.github.io/JudesChristmas/">
  <meta property="og:image" content="https://judemarkwell.github.io/JudesChristmas/img/invite-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Gift Circles: wrapped presents under string lights">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="theme-color" content="#b3202a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="no-nav">
  <div class="snow" id="snow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a href="#circles" class="brand">
        <span class="brand-icon" aria-hidden="true">🎄</span>
        <span class="brand-text">Gift Circles</span>
      </a>
    </div>
    <div class="lights" aria-hidden="true"></div>
  </header>

  <!-- App-style layout: header, tab bar and this scroll area are stacked in normal flow.
       Nothing is position: fixed over the page, because newer iPhones' Safari can misplace
       where taps land on fixed bars (taps fall through to the page behind). -->
  <nav class="tabs" aria-label="Sections">
    <a href="#circles" class="tab" data-view="circles"><span class="tab-icon" aria-hidden="true">🎄</span><span>Circles</span></a>
    <a href="#mine" class="tab" data-view="mine"><span class="tab-icon" aria-hidden="true">🎁</span><span>My list</span></a>
    <a href="#shop" class="tab" data-view="shop"><span class="tab-icon" aria-hidden="true">🛷</span><span>Shopping</span></a>
    <a href="#profile" class="tab" data-view="profile"><span class="tab-icon" aria-hidden="true">👤</span><span>Profile</span></a>
  </nav>

  <div id="scroller" class="scroller">
  <main>

    <div id="view" class="view" aria-live="polite">
      <p class="loading">Warming up the sleigh…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p id="storage-note" class="muted"></p>
  </footer>
  </div>

  <dialog id="modal" class="modal">
    <button class="modal-close" type="button" data-close aria-label="Close">✕</button>
    <div class="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
